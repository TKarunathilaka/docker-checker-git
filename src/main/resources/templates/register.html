<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account &bull; Spring Boot Text File DB</title>
  <meta name="description" content="Register a new account stored in local text files.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="bg-grid-overlay"></div>

  <!-- Header Nav -->
  <header class="header-nav">
    <a href="/" class="brand-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm2 2v2h12V8H6zm0 4v2h12v-2H6zm0 4v2h8v-2H6z"/>
        </svg>
      </div>
      <span>Spring<span style="color: var(--primary-light);">Doc</span></span>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/login" class="btn btn-outline btn-sm">Sign In</a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <span class="badge badge-emerald" style="margin-bottom:0.75rem;">Instant Registration</span>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Your credentials will be hashed and written to data/users.txt</p>
      </div>

      <!-- Alert Banners -->
      <div th:if="${errorMessage}" class="alert alert-danger" id="alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${errorMessage}">Error</span>
      </div>

      <!-- Registration Form -->
      <form th:action="@{/register}" method="POST" id="form-register">
        <div class="form-group">
          <label class="form-label" for="register-name">Full Name</label>
          <input type="text" id="register-name" name="name" class="form-input" placeholder="Alex Morgan" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email Address</label>
          <input type="email" id="register-email" name="email" class="form-input" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password (min 4 chars)</label>
          <input type="password" id="register-password" name="password" class="form-input" placeholder="••••••••" required minlength="4">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-confirm-password">Confirm Password</label>
          <input type="password" id="register-confirm-password" name="confirmPassword" class="form-input" placeholder="••••••••" required minlength="4">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-submit-register" style="margin-top:1.5rem;">
          Register Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login" id="link-to-login">Sign in here</a>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
