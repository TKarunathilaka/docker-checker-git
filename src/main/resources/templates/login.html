<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; Spring Boot Text File DB</title>
  <meta name="description" content="Sign in to your Spring Boot text file database account.">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div class="bg-grid-overlay"></div>

  <!-- Header Nav -->
  <header class="header-nav">
    <a href="/" class="brand-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm2 2v2h12V8H6zm0 4v2h12v-2H6zm0 4v2h8v-2H6z"/>
        </svg>
      </div>
      <span>Spring<span style="color: var(--primary-light);">Doc</span></span>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/register" class="btn btn-outline btn-sm">Create Account</a>
    </nav>
  </header>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <span class="badge badge-primary" style="margin-bottom:0.75rem;">Account Access</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your file database records</p>
      </div>

      <!-- Quick Demo Account Helper -->
      <div class="demo-pill-card">
        <div class="demo-credentials-text">
          <div><strong>Demo:</strong> demo@example.com</div>
          <div><strong>Password:</strong> Password123!</div>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="btn-fill-demo">Quick Fill</button>
      </div>

      <!-- Alert Banners -->
      <div th:if="${errorMessage}" class="alert alert-danger" id="alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${errorMessage}">Error</span>
      </div>

      <div th:if="${successMessage}" class="alert alert-success" id="alert-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span th:text="${successMessage}">Success</span>
      </div>

      <div th:if="${infoMessage}" class="alert alert-info" id="alert-info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span th:text="${infoMessage}">Info</span>
      </div>

      <!-- Login Form -->
      <form th:action="@{/login}" method="POST" id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" class="form-input" placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login" style="margin-top:1.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register" id="link-to-register">Register here</a>
      </div>
    </div>
  </div>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
